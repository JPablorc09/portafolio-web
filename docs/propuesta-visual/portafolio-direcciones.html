<style>
  #jp-design-review { width:100%; }
  #jp-design-review [hidden] { display:none !important; }
  #jp-design-review .jp-window {
    --jp-bg:#0b1220; --jp-panel:#111c2e; --jp-raised:#17253b;
    --jp-ink:#f1f5fb; --jp-muted:#b0bfd3; --jp-line:#2b3c54;
    --jp-accent:#83b4ff; --jp-button:#2563eb; --jp-on-button:#fff;
    --jp-success:#9ce6c1; --jp-control:#506b91; --jp-radius:12px;
    color-scheme:dark; color:var(--jp-ink); background:var(--jp-bg);
    font:400 16px/1.6 Inter,"Segoe UI",Arial,sans-serif;
    width:100%; max-width:100%; margin:0 auto; container-type:inline-size;
    text-align:left; overflow-wrap:anywhere;
  }
  #jp-design-review .jp-window *, #jp-design-review .jp-window *::before, #jp-design-review .jp-window *::after { box-sizing:border-box; }
  #jp-design-review .jp-window a { color:inherit; text-decoration:none; }
  #jp-design-review .jp-window button, #jp-design-review .jp-window select { font:inherit; }
  #jp-design-review .jp-window button, #jp-design-review .jp-window a, #jp-design-review .jp-window select { cursor:pointer; }
  #jp-design-review .jp-window :focus-visible { outline:2px solid var(--jp-accent); outline-offset:4px; }
  #jp-design-review .jp-window h1, #jp-design-review .jp-window h2, #jp-design-review .jp-window h3 { color:var(--jp-ink); font-family:inherit; letter-spacing:-.035em; }
  #jp-design-review .jp-window h1 { font-size:clamp(34px,6.4cqi,62px); line-height:1.08; font-weight:650; margin:18px 0 22px; }
  #jp-design-review .jp-window h2 { font-size:clamp(25px,3.4cqi,34px); line-height:1.2; font-weight:600; margin:0 0 12px; }
  #jp-design-review .jp-window h3 { font-size:19px; line-height:1.35; font-weight:600; margin:10px 0; }
  #jp-design-review .jp-window p { margin:0 0 18px; color:var(--jp-muted); }
  #jp-design-review .jp-window ul { padding-left:20px; color:var(--jp-muted); }
  #jp-design-review .jp-window li { margin-bottom:8px; }
  #jp-design-review .jp-window img { display:block; width:100%; height:auto; }
  #jp-design-review .jp-header { padding:18px 4.5%; border-bottom:1px solid var(--jp-line); background:var(--jp-bg); }
  #jp-design-review .jp-header-row { display:flex; gap:20px; align-items:center; justify-content:space-between; }
  #jp-design-review .jp-brand { display:flex; align-items:center; gap:11px; flex-shrink:0; }
  #jp-design-review .jp-monogram { display:grid; place-items:center; width:38px; height:38px; color:var(--jp-accent); background:var(--jp-panel); border:1px solid var(--jp-line); border-radius:8px; font-weight:600; font-size:14px; }
  #jp-design-review .jp-brand-text { font-size:13px; line-height:1.4; }
  #jp-design-review .jp-brand-text strong { display:block; color:var(--jp-ink); font-weight:600; }
  #jp-design-review .jp-brand-text span { color:var(--jp-muted); font-size:12px; }
  #jp-design-review .jp-nav { display:flex; align-items:center; gap:20px; font-size:13px; }
  #jp-design-review .jp-nav a { color:var(--jp-muted); padding:7px 0; }
  #jp-design-review .jp-nav a[aria-current="page"], #jp-design-review .jp-nav a:hover { color:var(--jp-accent); }
  #jp-design-review .jp-nav details { position:relative; }
  #jp-design-review .jp-nav summary { cursor:pointer; color:var(--jp-muted); }
  #jp-design-review .jp-subnav { position:absolute; z-index:5; top:32px; right:0; width:180px; padding:12px 18px; border:1px solid var(--jp-line); border-radius:var(--jp-radius); background:var(--jp-panel); }
  #jp-design-review .jp-subnav a { display:block; padding:8px 0; }
  #jp-design-review .jp-action { display:inline-flex; min-height:44px; padding:10px 17px; align-items:center; justify-content:center; gap:8px; border:1px solid var(--jp-control); background:var(--jp-panel); color:var(--jp-ink); border-radius:8px; font-size:14px; font-weight:500; text-align:center; white-space:normal; }
  #jp-design-review .jp-action--primary { background:var(--jp-button); border-color:var(--jp-button); color:var(--jp-on-button); }
  #jp-design-review .jp-action:hover { filter:brightness(1.12); }
  #jp-design-review .jp-menu-toggle { display:none; }
  #jp-design-review .jp-mobile-nav { display:grid; padding-top:18px; gap:0; }
  #jp-design-review .jp-mobile-nav a { padding:12px 0; border-top:1px solid var(--jp-line); }
  #jp-design-review .jp-content { padding:0 4.5%; }
  #jp-design-review .jp-hero { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:42px; align-items:center; padding:54px 0 48px; min-height:410px; }
  #jp-design-review .jp-eyebrow { display:block; color:var(--jp-accent); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
  #jp-design-review .jp-available { display:inline-flex; gap:8px; align-items:center; color:var(--jp-success); font-size:13px; margin-bottom:20px; }
  #jp-design-review .jp-available::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  #jp-design-review .jp-lead { max-width:570px; font-size:16px; }
  #jp-design-review .jp-role { color:var(--jp-accent); }
  #jp-design-review .jp-actions { display:flex; flex-wrap:wrap; gap:10px; margin:24px 0 0; }
  #jp-design-review .jp-profile-aside { border-left:1px solid var(--jp-line); padding-left:28px; }
  #jp-design-review .jp-aside-item { margin-top:20px; }
  #jp-design-review .jp-aside-item strong { display:block; font-size:15px; font-weight:500; }
  #jp-design-review .jp-aside-item span { display:block; color:var(--jp-muted); font-size:13px; }
  #jp-design-review .jp-stack { display:flex; flex-wrap:wrap; gap:8px; }
  #jp-design-review .jp-tag { display:inline-flex; padding:4px 9px; border:1px solid var(--jp-line); border-radius:5px; font-size:12px; color:var(--jp-muted); background:var(--jp-bg); }
  #jp-design-review .jp-section { padding:36px 0; border-top:1px solid var(--jp-line); }
  #jp-design-review .jp-section-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; }
  #jp-design-review .jp-section-head p { margin:0; }
  #jp-design-review .jp-text-link { display:inline-flex; min-height:44px; align-items:center; gap:8px; color:var(--jp-accent) !important; font-size:14px; }
  #jp-design-review .jp-project-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  #jp-design-review .jp-project { display:flex; flex-direction:column; min-width:0; border:1px solid var(--jp-line); background:var(--jp-panel); border-radius:var(--jp-radius); overflow:hidden; }
  #jp-design-review .jp-preview { aspect-ratio:16/10; background:var(--jp-bg); border-bottom:1px solid var(--jp-line); display:flex; align-items:center; justify-content:center; }
  #jp-design-review .jp-preview img { height:100%; object-fit:contain; }
  #jp-design-review .jp-preview-text { padding:22px; text-align:center; color:var(--jp-muted); font-size:13px; }
  #jp-design-review .jp-preview-text i { display:block; margin:0 auto 9px; width:24px; height:24px; color:var(--jp-accent); }
  #jp-design-review .jp-project-body { display:flex; flex:1; flex-direction:column; padding:19px; }
  #jp-design-review .jp-project-body h3 { font-size:17px; letter-spacing:-.02em; }
  #jp-design-review .jp-project-body p { font-size:14px; }
  #jp-design-review .jp-state { font-size:12px; color:var(--jp-accent); }
  #jp-design-review .jp-project-body .jp-stack { margin-top:auto; padding-top:4px; }
  #jp-design-review .jp-project-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-top:1px solid var(--jp-line); padding-top:12px; margin-top:18px; }
  #jp-design-review .jp-project-footer a { color:var(--jp-accent); font-size:13px; min-height:40px; display:inline-flex; align-items:center; }
  #jp-design-review .jp-project-list { display:grid; gap:14px; }
  #jp-design-review .jp-project-list .jp-project { display:grid; grid-template-columns:220px minmax(0,1fr); }

<script>
(() => {
  const root = document.getElementById('jp-design-review');
  const projects = JSON.parse(root.querySelector('#jp-design-data').textContent);
  const images = JSON.parse(root.querySelector('#jp-design-images').textContent);
  const contexts = { institutional:'Institucional', personal:'Personal', demo:'Demo comercial' };
  const statuses = { professional:'Acceso restringido', published:'Publicado', documented:'Desarrollado · Sin demo pública', development:'En desarrollo', testing:'En desarrollo y pruebas' };
  const categories = { all:'Todas las categorías', empresarial:'Empresariales', integracion:'Integraciones', 'full-stack':'Full Stack', datos:'Datos y monitoreo', 'web-comercial':'Web comercial', movil:'Móviles', 'herramienta-web':'Herramientas web', backend:'Backend y arquitectura' };
  const cv = 'https://portafolioprofesionaljuanpablorojasc.netlify.app/assets/documents/CV_Juan_Pablo_Rojas_Contreras.pdf';
  const profile = { email:'juanparojasc1999@gmail.com', whatsapp:'https://wa.me/50662794709', github:'https://github.com/JPablorc09' };
  const escape = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const saved = window.openai?.widgetState?.privateContent?.views || {};
  const states = {};
  const instances = [];
  const tags = values => `<div class="jp-stack">${values.map(value => `<span class="jp-tag">${escape(value)}</span>`).join('')}</div>`;
  const navLink = (view, label, current = '') => `<a href="#${view}" data-view="${view}"${current === view ? ' aria-current="page"' : ''}>${label}</a>`;
  const action = (view, label, primary = false) => `<a href="#${view}" data-view="${view}" class="jp-action${primary ? ' jp-action--primary' : ''}">${label}</a>`;
  const external = (url, label, primary = false) => `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer" class="jp-action${primary ? ' jp-action--primary' : ''}">${label}</a>`;
  const list = values => `<ul>${values.map(value => `<li>${escape(value)}</li>`).join('')}</ul>`;
  function preview(project) {
    if (project.context === 'institutional') return '<div class="jp-preview-text"><i data-lucide="lock-keyhole" aria-hidden="true"></i>Proyecto institucional<br>Representación genérica · Sin capturas reales</div>';
    if (images[project.id]) return `<img src="${images[project.id]}" alt="Captura de ${escape(project.title)}" width="1900" height="1000" loading="lazy">`;
    return `<div class="jp-preview-text"><i data-lucide="${project.type === 'movil' ? 'smartphone' : 'code-2'}" aria-hidden="true"></i>${escape(contexts[project.context])}<br>Sin captura en esta propuesta</div>`;
  }
  function projectCard(project) {
    return `<article class="jp-project"><a class="jp-preview" href="#caso-${escape(project.id)}" data-project="${escape(project.id)}" aria-label="Ver caso de ${escape(project.title)}">${preview(project)}</a><div class="jp-project-body"><span class="jp-state">${escape(contexts[project.context])} · ${escape(statuses[project.status])}</span><h3>${escape(project.title)}</h3><p>${escape(project.shortDescription)}</p>${tags(project.technologies.slice(0,3))}<div class="jp-project-footer"><a href="#caso-${escape(project.id)}" data-project="${escape(project.id)}">Ver caso de estudio <span aria-hidden="true">↗</span></a>${project.demo && project.context !== 'institutional' ? `<a href="${escape(project.demo)}" target="_blank" rel="noopener noreferrer">Abrir demo ↗</a>` : ''}</div></div></article>`;
  }
  const experienceBlock = () => `<div class="jp-experience"><div class="jp-period">Agosto 2025 — julio 2026<br>Servicios profesionales</div><div><h3>Desarrollo e integración de sistemas</h3><p><strong>Grupo Alega Costa Rica</strong> · Empresa contratante<br>Servicios prestados para el Poder Judicial de Costa Rica.</p><p>Aplicaciones con ASP.NET Core, SQL Server e integración de APIs. Mantenimiento de sistemas y trabajo con información de monitoreo.</p>${tags(['C#','ASP.NET Core','SQL Server','APIs REST'])}</div></div>`;
  const homeTail = () => `<section class="jp-section"><div class="jp-section-head"><div><span class="jp-eyebrow">Trabajo seleccionado</span><h2>Proyectos con contexto.</h2><p>Qué construí, con qué tecnologías y en qué estado se encuentra.</p></div><a href="#projects" data-view="projects" class="jp-text-link">Ver los 11 proyectos ↗</a></div><div class="jp-project-grid">${['ventas','escaneatodo','incidentes'].map(id => projectCard(projects.find(project => project.id === id))).join('')}</div></section><section class="jp-section"><div class="jp-section-head"><div><span class="jp-eyebrow">Experiencia profesional</span><h2>Software aplicado a procesos.</h2></div><a href="#experience" data-view="experience" class="jp-text-link">Ver experiencia ↗</a></div>${experienceBlock()}</section><section class="jp-section"><div class="jp-section-head"><div><span class="jp-eyebrow">Soluciones para negocios</span><h2>De la necesidad a la aplicación.</h2></div><a href="#contact" data-view="contact" class="jp-text-link">Solicitar cotización ↗</a></div><div class="jp-service-grid"><article class="jp-service"><h3>Páginas web</h3><p>Presencia profesional, catálogos y contacto para negocios.</p></article><article class="jp-service"><h3>Sistemas web</h3><p>Aplicaciones para administrar información y digitalizar procesos.</p></article><article class="jp-service"><h3>APIs e integraciones</h3><p>Servicios para conectar aplicaciones y automatizar tareas.</p></article></div></section><section class="jp-section jp-learning"><div><span class="jp-eyebrow">Aprendizaje continuo</span><h3>Desarrollo asistido por IA</h3><p>Actualmente en formación y práctica con Codex. Análisis, programación y revisión de código con validación humana.</p></div><a href="#skills" data-view="skills" class="jp-text-link">Ver conocimientos ↗</a></section>`;
  function home(direction) {
    const intro = `<span class="jp-available">Disponible para oportunidades y proyectos</span><span class="jp-eyebrow">Juan Pablo Rojas Contreras · Costa Rica</span><h1>Desarrollo Full Stack.<br><span class="jp-role">.NET y Angular.</span></h1><p class="jp-lead">Construyo aplicaciones web, integro sistemas y trabajo con bases de datos. Bachiller en Ingeniería de Sistemas, UAM · 2024.</p><div class="jp-actions">${action('projects','Explorar proyectos ↗',true)}${external(cv,'Descargar CV ↓')}${action('contact','Contactar')}</div>`;
    const aside = `<aside class="jp-profile-aside" aria-label="Resumen profesional"><span class="jp-eyebrow">Enfoque profesional</span><h3>Sistemas empresariales.<br>Integraciones. Soluciones web.</h3><div class="jp-aside-item"><strong>.NET · Angular · SQL Server</strong><span>Desarrollo, datos y APIs</span></div><div class="jp-aside-item"><strong>Experiencia profesional</strong><span>Grupo Alega Costa Rica<br>Servicios para el Poder Judicial</span></div><div class="jp-aside-item"><strong>Aprendizaje continuo</strong><span>Codex y desarrollo asistido por IA</span></div></aside>`;
    const featured = projects.find(project => project.id === 'ventas');
    const hero = direction === 'editorial' ? `<section class="jp-hero"><div>${intro}</div>${aside}</section>` : `<section class="jp-featured-hero"><div>${intro}</div><article class="jp-featured-case"><a href="#caso-ventas" data-project="ventas" class="jp-preview" aria-label="Ver Sistema de Ventas e Inventario">${preview(featured)}</a><div class="jp-project-body"><span class="jp-state">Proyecto personal · Sin demo pública</span><h3>Sistema de Ventas e Inventario</h3><a href="#caso-ventas" data-project="ventas" class="jp-text-link">Explorar el caso de estudio ↗</a></div></article></section>`;
    return hero + homeTail();
  }
  function catalog(state) {
    const filtered = projects.filter(project => (state.context === 'all' || project.context === state.context) && (state.category === 'all' || project.type === state.category));
    const shown = state.expanded ? filtered : filtered.slice(0,6);
    return `<header class="jp-page-header"><span class="jp-eyebrow">Portafolio</span><h1>Proyectos y casos de estudio.</h1><p>Aplicaciones propias, experiencia institucional y demostraciones comerciales. Cada proyecto conserva su contexto y estado real.</p></header><div class="jp-filters" role="group" aria-label="Contexto del proyecto">${Object.entries({all:'Todos',personal:'Personales',institutional:'Institucionales',demo:'Demos comerciales'}).map(([value,label]) => `<button type="button" class="jp-filter" data-context="${value}" aria-pressed="${state.context === value}">${label}</button>`).join('')}</div><div class="jp-filter-row"><label>Categoría<select class="jp-select" data-category>${Object.entries(categories).map(([value,label]) => `<option value="${value}"${state.category === value ? ' selected' : ''}>${label}</option>`).join('')}</select></label><span class="jp-result" aria-live="polite">${filtered.length} ${filtered.length === 1 ? 'proyecto' : 'proyectos'}</span></div><div class="jp-project-grid">${shown.map(projectCard).join('')}</div>${!filtered.length ? `<section class="jp-section"><h2>No hay proyectos en esta selección.</h2><button type="button" class="jp-action" data-reset>Ver todos los proyectos</button></section>` : ''}${shown.length < filtered.length ? `<div class="jp-actions"><button type="button" class="jp-action" data-expand>Mostrar los ${filtered.length - shown.length} restantes</button></div>` : ''}<div class="jp-section" style="margin-top:30px"><p>Los proyectos institucionales muestran únicamente información general y representaciones genéricas. No incluyen código ni capturas internas.</p></div>`;
  }
  function detail(state) {
    const project = projects.find(project => project.id === state.project) || projects[0];
    const restricted = project.context === 'institutional';
    const index = projects.indexOf(project);
    return `<header class="jp-page-header"><a href="#projects" data-view="projects" class="jp-text-link">← Volver a proyectos</a><span class="jp-eyebrow">${escape(contexts[project.context])} · ${escape(statuses[project.status])}</span><h1>${escape(project.title)}</h1><p>${escape(project.shortDescription)}</p></header><div class="jp-detail-grid"><div>${restricted ? '<div class="jp-confidential"><i data-lucide="lock-keyhole" aria-hidden="true"></i><strong>Contenido institucional protegido</strong><small>Representación genérica · No es una captura real.</small><small>Sin datos internos, código propietario ni configuraciones.</small></div>' : images[project.id] ? `<div class="jp-gallery"><figure><img src="${images[project.id]}" alt="Captura del proyecto ${escape(project.title)}"><figcaption>Captura del proyecto · Vista completa, sin recorte.</figcaption></figure></div>` : '<div class="jp-note">Sin capturas reales en esta propuesta.</div>'}<h2>Necesidad que aborda</h2><p>${escape(project.problem)}</p><h2>La solución</h2><p>${escape(project.fullDescription)}</p><h2>${escape(project.featuresHeading)}</h2>${list(project.features)}${project.pendingFeatures.length ? `<h2>Pendiente de validación</h2>${list(project.pendingFeatures)}` : ''}${!restricted && project.architecture.length ? `<h2>Organización técnica</h2>${list(project.architecture)}` : ''}<h2>Retos y aprendizajes</h2>${list(project.challenges.slice(0,3))}${list(project.learnings.slice(0,3))}<div class="jp-note"><strong>Alcance de la información</strong><br>${escape(project.verificationNote)}</div></div><aside class="jp-detail-aside"><h3>Ficha del proyecto</h3><dl><dt>Contexto</dt><dd>${escape(contexts[project.context])}</dd><dt>Estado</dt><dd>${escape(statuses[project.status])}</dd><dt>Tecnologías</dt><dd>${tags(project.technologies)}</dd></dl><div class="jp-actions">${project.demo && !restricted ? external(project.demo,'Abrir demostración ↗',true) : ''}${project.github && !restricted ? external(project.github,'Repositorio público ↗') : ''}</div>${restricted ? '<div class="jp-note">Acceso restringido. Se presenta solo un resumen general de la participación profesional.</div>' : ''}${action('contact','Conversemos sobre su proyecto')}</aside></div><nav class="jp-section jp-section-head" aria-label="Navegación entre proyectos">${projects[index - 1] ? `<a href="#caso-${projects[index - 1].id}" data-project="${projects[index - 1].id}" class="jp-text-link">← ${escape(projects[index - 1].title)}</a>` : '<span></span>'}${projects[index + 1] ? `<a href="#caso-${projects[index + 1].id}" data-project="${projects[index + 1].id}" class="jp-text-link">${escape(projects[index + 1].title)} →</a>` : ''}</nav>`;
  }
  function profilePage(view) {
    if (view === 'education') return `<header class="jp-page-header"><span class="jp-eyebrow">Formación</span><h1>Aprender, aplicar y mejorar.</h1></header><section class="jp-section"><span class="jp-eyebrow">Formación universitaria · 2024</span><h2>Bachillerato en Ingeniería de Sistemas</h2><p>Universidad Americana (UAM) · Graduado.</p>${tags(['Desarrollo de software','Bases de datos','Análisis de sistemas'])}</section><section class="jp-section"><h2>Formación continua</h2><p>Aprendizaje aplicado mediante proyectos Full Stack, integraciones y práctica de desarrollo asistido por IA.</p>${action('skills','Ver conocimientos')}</section>`;
    if (view === 'skills') return `<header class="jp-page-header"><span class="jp-eyebrow">Conocimientos</span><h1>Experiencia, práctica y aprendizaje.</h1><p>El contexto de uso acompaña a cada tecnología; las herramientas en formación se identifican por separado.</p></header><div class="jp-skill-group"><small>Uso profesional confirmado</small><h3>Desarrollo e integración de sistemas</h3>${tags(['C#','ASP.NET Core MVC','APIs REST','Entity Framework Core','SQL Server','IIS','Aranda ASMS','Información de PRTG'])}</div><div class="jp-skill-group"><small>Proyectos personales</small><h3>Aplicaciones web y móviles</h3>${tags(['Angular','TypeScript','JWT','React Native','Expo','SQLite'])}</div><div class="jp-skill-group"><small>Actualmente en formación y práctica</small><h3>Desarrollo asistido por Inteligencia Artificial</h3><p>Uso de Codex para analizar proyectos, planificar funcionalidades, revisar código, depurar y documentar. Las propuestas generadas requieren revisión humana, pruebas y cuidado de la información sensible.</p>${tags(['Codex','Análisis de código','Refactorización guiada','Documentación'])}</div>`;
    return `<header class="jp-page-header"><span class="jp-eyebrow">Sobre mí</span><h1>Juan Pablo Rojas Contreras.</h1><p>Ingeniero de Sistemas | Desarrollador Full Stack .NET y Angular</p></header><div class="jp-two-col"><section><h2>Desarrollo con contexto.</h2><p>Soy Bachiller en Ingeniería de Sistemas por la Universidad Americana, graduado en 2024. Mi experiencia se centra en aplicaciones empresariales, bases de datos e integración de sistemas.</p><p>Entre agosto de 2025 y julio de 2026 presté servicios mediante Grupo Alega Costa Rica para el Poder Judicial de Costa Rica. Complemento esa experiencia con proyectos personales y aprendizaje continuo.</p><p>Busco oportunidades como desarrollador Full Stack, .NET o Angular, ingeniero de sistemas junior o analista de sistemas.</p>${external(cv,'Descargar CV ↓',true)}</section><section><h2>En qué puedo aportar</h2>${list(['Desarrollo y mantenimiento de aplicaciones.','Integración de APIs y servicios.','Bases de datos y procesamiento de información.','Análisis de incidencias de sistemas.'])}<div class="jp-profile-links">${navLink('education','Formación ↗')}${navLink('skills','Conocimientos ↗')}${navLink('experience','Experiencia ↗')}</div></section></div><section class="jp-section jp-learning"><div><span class="jp-eyebrow">Aprendizaje continuo</span><h3>Desarrollo asistido por IA</h3><p>Actualmente en formación y práctica con Codex, con revisión humana del código generado.</p></div>${action('skills','Ver conocimientos')}</section>`;
  }
  function services() {
    return `<header class="jp-page-header"><span class="jp-eyebrow">Servicios</span><h1>Software para las necesidades de su negocio.</h1><p>Páginas web, aplicaciones e integraciones con un alcance definido según cada proyecto.</p>${action('contact','Solicitar cotización ↗',true)}</header><section class="jp-section"><div class="jp-two-col">${[['Páginas web profesionales','Presencia digital, catálogos y contacto para comercios y profesionales.'],['Aplicaciones y sistemas web','Administración de información y procesos internos personalizados.'],['APIs e integraciones','Servicios REST con ASP.NET Core y conexión entre aplicaciones.'],['Datos y mantenimiento','SQL Server, mejoras de sistemas y automatización mediante software.']].map(([name,description]) => `<article class="jp-service"><h3>${name}</h3><p>${description}</p></article>`).join('')}</div></section><section class="jp-section"><h2>Planes web actuales</h2><div class="jp-service-grid">${[['Emprendedor','₡75.000'],['Profesional','₡120.000'],['Personalizado','₡180.000']].map(([name,price]) => `<article class="jp-plan"><h3>${name}</h3><span class="jp-period">Desde</span><br><strong>${price}</strong><p>Precio de referencia; sujeto al alcance y requerimientos.</p>${action('contact','Consultar alcance')}</article>`).join('')}</div></section><section class="jp-section"><h2>Un proceso claro.</h2>${list(['Conversar sobre la necesidad y los objetivos.','Definir alcance, entregables y presupuesto.','Desarrollar, revisar y validar.','Preparar la publicación acordada.'])}</section>`;
  }
  function contact() {
    return `<header class="jp-page-header"><span class="jp-eyebrow">Contacto</span><h1>Conversemos sobre lo que necesita.</h1><p>Disponible para oportunidades laborales y proyectos de desarrollo web en Costa Rica.</p></header><div class="jp-two-col"><section class="jp-contact-panel"><span class="jp-eyebrow">Para reclutadores</span><h2>Oportunidad profesional</h2><p>Desarrollo Full Stack, .NET, Angular, sistemas empresariales e integración de APIs.</p><p>${escape(profile.email)}</p><div class="jp-actions"><a class="jp-action jp-action--primary" href="mailto:${escape(profile.email)}?subject=Oportunidad%20profesional">Enviar correo ↗</a>${external(cv,'Descargar CV ↓')}</div></section><section class="jp-contact-panel"><span class="jp-eyebrow">Para negocios y empresas</span><h2>Cotizar un proyecto</h2><p>Cuénteme qué proceso necesita digitalizar o qué aplicación desea desarrollar.</p><p>WhatsApp · +506 6279-4709</p>${external(profile.whatsapp,'Contactar por WhatsApp ↗',true)}</section></div><section class="jp-section" style="margin-top:32px"><h2>Perfiles profesionales</h2><div class="jp-actions">${external(profile.github,'GitHub ↗')}${external('https://www.linkedin.com/in/juan-pablo-rojas-contreras-15ab09345/','LinkedIn ↗')}</div></section>`;
  }
  function persist() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{propuesta:'Portafolio profesional de Juan Pablo Rojas',pantallas:Object.fromEntries(Object.entries(states).map(([key,value]) => [key,value.page]))},privateContent:{views:states}}).catch(() => {});
  }
  function mount(site) {
    const direction = site.dataset.direction;
    const previous = saved[direction] || {};
    const state = states[direction] = {page:['home','projects','detail','experience','about','education','skills','services','contact'].includes(previous.page) ? previous.page : 'home',context:['all','personal','institutional','demo'].includes(previous.context) ? previous.context : 'all',category:categories[previous.category] ? previous.category : 'all',project:projects.some(project => project.id === previous.project) ? previous.project : 'ventas',expanded:!!previous.expanded,menu:false};
    const appearance = { mobile:false, radius:12 };
    const render = () => {
      const current = state.page;
      const header = `<header class="jp-header"><div class="jp-header-row"><a href="#home" data-view="home" class="jp-brand" aria-label="Inicio de Juan Pablo Rojas Contreras"><span class="jp-monogram">JP</span><span class="jp-brand-text"><strong>Juan Pablo Rojas</strong><span>Desarrollador Full Stack</span></span></a><nav class="jp-nav" aria-label="Navegación principal">${navLink('projects','Proyectos',current)}${navLink('experience','Experiencia',current)}<details><summary>Perfil</summary><div class="jp-subnav">${navLink('about','Sobre mí',current)}${navLink('education','Formación',current)}${navLink('skills','Conocimientos',current)}</div></details>${navLink('services','Servicios',current)}${navLink('contact','Contacto',current)}</nav><a class="jp-action jp-desktop-cv" href="${cv}" target="_blank" rel="noopener noreferrer">CV ↓</a><button type="button" class="jp-action jp-menu-toggle" data-menu aria-controls="jp-menu-${direction}" aria-expanded="${state.menu}">${state.menu ? 'Cerrar' : 'Menú'} <i data-lucide="${state.menu ? 'x' : 'menu'}" aria-hidden="true"></i></button></div><nav id="jp-menu-${direction}" class="jp-mobile-nav" aria-label="Navegación móvil"${state.menu ? '' : ' hidden'}>${navLink('home','Inicio',current)}${navLink('projects','Proyectos',current)}${navLink('experience','Experiencia',current)}${navLink('about','Sobre mí',current)}${navLink('education','Formación',current)}${navLink('skills','Conocimientos',current)}${navLink('services','Servicios',current)}${navLink('contact','Contacto',current)}<a href="${cv}" target="_blank" rel="noopener noreferrer">Descargar CV ↓</a></nav></header>`;
      let content;
      if (current === 'home') content = home(direction);
      else if (current === 'projects') content = catalog(state);
      else if (current === 'detail') content = detail(state);
      else if (current === 'experience') content = `<header class="jp-page-header"><span class="jp-eyebrow">Experiencia</span><h1>Desarrollo e integración de sistemas.</h1><p>Aplicaciones empresariales, mantenimiento y procesamiento de información de monitoreo.</p></header><section class="jp-section">${experienceBlock()}<div style="margin-top:24px">${list(['Desarrollo y mantenimiento con C# y ASP.NET Core MVC.','Integración de APIs REST, Aranda ASMS e información procedente de PRTG.','Trabajo con SQL Server y Entity Framework Core.','Automatización de registro y envío de incidencias.','Publicación en IIS y documentación técnica.'])}</div></section><section class="jp-section"><h2>Proyectos relacionados</h2><div class="jp-project-grid">${['incidentes','fallapp','prtg'].map(id => projectCard(projects.find(project => project.id === id))).join('')}</div></section>`;
      else if (current === 'services') content = services();
      else if (current === 'contact') content = contact();
      else content = profilePage(current);
      site.innerHTML = `${header}<main class="jp-content">${content}</main><footer class="jp-footer"><span>Juan Pablo Rojas Contreras · Costa Rica</span><nav aria-label="Enlaces del pie de página">${navLink('home','Inicio')}${navLink('about','Sobre mí')}${navLink('education','Formación')}${navLink('skills','Conocimientos')}${navLink('contact','Contacto')}</nav></footer><div class="jp-a11y" role="status" aria-live="polite">${({home:'Inicio',projects:'Proyectos',detail:'Caso de estudio',experience:'Experiencia',about:'Sobre mí',education:'Formación',skills:'Conocimientos',services:'Servicios',contact:'Contacto'})[current]}</div>`;
      if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    };
    site.addEventListener('click', event => {
      const target = event.target.closest('a,button');
      if (!target || !site.contains(target)) return;
      const focusKey = target.dataset.view || target.dataset.project || target.dataset.context;
      if (target.hasAttribute('data-view')) { event.preventDefault(); state.page = target.dataset.view; state.menu = false; }
      else if (target.hasAttribute('data-project')) { event.preventDefault(); state.page = 'detail'; state.project = target.dataset.project; state.menu = false; }
      else if (target.hasAttribute('data-context')) { state.context = target.dataset.context; state.expanded = false; }
      else if (target.hasAttribute('data-menu')) state.menu = !state.menu;
      else if (target.hasAttribute('data-reset')) { state.context = 'all'; state.category = 'all'; state.expanded = false; }
      else if (target.hasAttribute('data-expand')) state.expanded = true;
      else return;
      render(); persist();
      if (target.hasAttribute('data-menu')) site.querySelector('[data-menu]')?.focus();
      else if (target.hasAttribute('data-context')) site.querySelector(`[data-context="${focusKey}"]`)?.focus();
      else if (target.hasAttribute('data-view')) site.querySelector(`[data-view="${state.page}"]`)?.focus();
      else if (target.hasAttribute('data-project')) site.querySelector('.jp-page-header a')?.focus();
    });
    site.addEventListener('change', event => { if (event.target.matches('[data-category]')) { state.category = event.target.value; state.expanded = false; render(); persist(); site.querySelector('[data-category]')?.focus(); } });
    site.addEventListener('keydown', event => { if (event.key === 'Escape' && state.menu) { state.menu = false; render(); site.querySelector('[data-menu]')?.focus(); } });
    const applyAppearance = () => { site.style.maxWidth = appearance.mobile ? '390px' : '100%'; site.style.setProperty('--jp-radius',appearance.radius + 'px'); };
    render(); applyAppearance(); instances.push({direction,state,site,render});
    if (globalThis.Tweak) {
      const tweak = new Tweak({container:site,onChange:applyAppearance});
      tweak.addToggle(appearance,'mobile',{label:'Vista móvil'});
      tweak.addSlider(appearance,'radius',{label:'Radio de las tarjetas',min:6,max:16,step:2,unit:'px',reference:'--jp-radius'});
    }
  }
  root.querySelectorAll('.jp-window').forEach(mount);
  window.addEventListener('openai:set_globals', event => {
    const views = event.detail?.globals?.widgetState?.privateContent?.views;
    if (!views) return;
    for (const instance of instances) {
      const restored = views[instance.direction];
      if (!restored) continue;
      const next = { ...instance.state };
      if (['home','projects','detail','experience','about','education','skills','services','contact'].includes(restored.page)) next.page = restored.page;
      if (['all','personal','institutional','demo'].includes(restored.context)) next.context = restored.context;
      if (categories[restored.category]) next.category = restored.category;
      if (projects.some(project => project.id === restored.project)) next.project = restored.project;
      next.expanded = !!restored.expanded;
      next.menu = !!restored.menu;
      if (Object.keys(next).every(key => next[key] === instance.state[key])) continue;
      Object.assign(instance.state, next);
      instance.render();
    }
  });
})();
</script>
