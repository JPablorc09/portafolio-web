<header class="navbar">

  <nav class="navbar__container">

    <!-- =====================================================
         IDENTIDAD / LOGO
         ===================================================== -->
    <a
      routerLink="/"
      class="navbar__brand"
      (click)="closeMenu()"
    >

      <span class="navbar__logo">
        JP
      </span>

      <span class="navbar__identity">
        <strong>
          Juan Pablo Rojas
        </strong>

        <small>
          Ingeniero de Sistemas
        </small>
      </span>

    </a>


    <!-- =====================================================
         BOTÓN MENÚ MÓVIL
         ===================================================== -->
    <button
      type="button"
      class="navbar__toggle"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- =====================================================
         NAVEGACIÓN
         ===================================================== -->
    <div
      class="navbar__links"
      [class.navbar__links--open]="menuOpen()"
    >

      <!-- INICIO -->
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Inicio
      </a>


      <!-- SOBRE MÍ -->
      <a
        routerLink="/sobre-mi"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Sobre mí
      </a>


      <!-- FORMACIÓN -->
      <a
        routerLink="/formacion"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Formación
      </a>


      <!-- EXPERIENCIA -->
      <a
        routerLink="/experiencia"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Experiencia
      </a>


      <!-- PROYECTOS -->
      <a
        routerLink="/proyectos"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Proyectos
      </a>


      <!-- SERVICIOS -->
      <a
        routerLink="/servicios"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Servicios
      </a>


      <!-- HABILIDADES -->
      <a
        routerLink="/habilidades"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Habilidades
      </a>


      <!-- CONTACTO -->
      <a
        routerLink="/contacto"
        routerLinkActive="active"
        class="navbar__contact"
        (click)="closeMenu()"
      >
        Contacto
      </a>

    </div>

  </nav>

</header>
